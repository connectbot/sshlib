SPECIFICATION Spec

CONSTANT MaxChannels = 1
CONSTANT EnableHostileEnvironment = TRUE
CONSTANT AdversaryOwnsHostKey = TRUE
CONSTANT EnforceKexProofVerification = TRUE

VIEW ModelView
ACTION_CONSTRAINT HostileSecurityActionConstraint

INVARIANT TypeOK
INVARIANT ParsedPacketProvenance
INVARIANT NoForgedPacketProvenance
INVARIANT AuthenticationSuccessIsGuarded
INVARIANT AuthenticationStateIsMonotonic
INVARIANT KexEventsAreStrictlySequenced
INVARIANT StrictInitialKexRejectsNonKexPackets
INVARIANT StrictKexInitMustBeFirst
INVARIANT UserAuthenticationRequiresInitialNewKeys
INVARIANT UnexpectedKexInitIsFatal
INVARIANT HostileKexReplyRequiresPossessionProof
INVARIANT NewKeysRequiresVerifiedTranscript
INVARIANT ProtectedHostilePacketsRequireTransportAuthentication
INVARIANT AuthenticationRequiresVerifiedTransport
INVARIANT HostileClientRolePacketsNeverAdvance
INVARIANT RejectedHostilePacketsDoNotEstablishSecurity

CHECK_DEADLOCK FALSE
