# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Prepare release
on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  prepare:
    name: Prepare release pull request
    if: github.event.label.name == 'release:prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RELEASE_ACTOR: ${{ github.event.sender.login }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Authorize release actor
        run: bash -c 'source .github/scripts/release-common.sh; require_maintainer'

      - name: Set up JDK
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          validate-wrappers: true

      - name: Create release app token
        id: release-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Prepare release branch
        id: release
        env:
          PUSH_TOKEN: ${{ steps.release-app-token.outputs.token }}
        run: |
          set -o pipefail
          bash .github/scripts/prepare-release.sh 2>&1 | tee "${RUNNER_TEMP}/release-prepare.log"

      - name: Open or update release pull request
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
        run: |
          set -o pipefail
          bash .github/scripts/upsert-release-pr.sh \
          "${{ steps.release.outputs.release_version }}" \
          "${{ steps.release.outputs.next_version }}" \
          "${{ steps.release.outputs.target_branch }}" \
          "${{ steps.release.outputs.work_branch }}" \
          "${{ steps.release.outputs.tag_name }}" \
          2>&1 | tee -a "${RUNNER_TEMP}/release-prepare.log"

      - name: Comment on prepared release
        run: >
          gh issue comment "${ISSUE_NUMBER}"
          --body "Prepared release PR for ${{ steps.release.outputs.tag_name }}
          targeting ${{ steps.release.outputs.target_branch }}."

      - name: Comment on failure
        if: failure()
        env:
          PUSH_TOKEN: ${{ steps.release-app-token.outputs.token }}
        run: bash .github/scripts/comment-issue-failure.sh "${RUNNER_TEMP}/release-prepare.log" "Prepare release"
