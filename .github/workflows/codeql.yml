name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '22 22 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: 'ubuntu-latest'
    permissions:
      # required for all workflows
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: java-kotlin
          build-mode: autobuild

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Work around CodeQL issue 20661
      # Downgrade Kotlin fron 2.3.x to 2.2.x \todo Remove when https://github.com/github/codeql/issues/20661 is fixed.
      run: sed -i -Ee 's/^(kotlin *= *"2\.)3\.0"/\12.21"/' gradle/libs.versions.toml
      shell: bash

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
